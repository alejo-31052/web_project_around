<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around The U.S.</title>
    <link href="./pages/index.css" rel="stylesheet" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          alt="Logotipo Around The U.S."
          class="logo header__logo"
          src="./images/logo.svg"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__image-container">
          <img class="profile__image" src="" alt="Avatar" />
          <img src="../public/images/Vector.png" alt="pencil-image" class="profile__image-edit-button">
          </div>
          <div class="profile__info">
            <h1 class="profile__title"></h1>
            <button
              aria-label="Editar perfil"
              class="profile__edit-button"
              type="button"
            ></button>
            <p class="profile__description"></p>
          </div>
          
          <button
            aria-label="Agregar tarjeta"
            class="profile__add-button"
            type="button"
          ></button>
          
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="cards__template">
            <li class="card">
              <img
                class="card__image"
                src=""
                alt=""
              />
              <button
                aria-label="Eliminar tarjeta"
                class="card__delete-button"
                type="button"
              ></button>
              <div class="card__description">
                <h2 class="card__title"></h2>
                <button
                  aria-label="Botón Me gusta"
                  class="card__like-button"
                  type="button"
                ></button>
              </div>
            </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">© 2025 Around The U.S.</p>
      </footer>

    <!--Form del perfil-->
      <div class="popup" id="edit-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Editar perfil</h3>
          <form class="popup__form" id="edit-profile-form">
            <input
              class="popup__input popup__input_type_name"
              name="name"
              placeholder="Nombre"
              type="text"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="popup__error popup__error_type_name"></span>
            <input
              class="popup__input popup__input_type_description"
              name="description"
              placeholder="Acerca de mí"
              type="text"
              required
              minlength="2"
              maxlength="200"
            />
            <span class="popup__error popup__error_type_description"></span>
            <button class="button popup__button" type="submit">Guardar</button>
          </form>
        </div>
      </div>

      <!--Form de confirmacion de eliminador de tarjeta-->
      <div class="popup" id="delete-confirmation-popup">
        <div class="popup__content popup__content-deletion-confirm">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="submit"
          ></button>
          <h3 class="popup__title">¿Estas Seguro/a?</h3>
            <button class="button popup__button" type="submit">Si</button>
          </form>
        </div>
      </div>

      <!--Form de cambio de foto de perfil-->

<div class="popup" id="change-profile-picture-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Cambiar foto de perfil</h3>
          <form class="popup__form" id="change-profile-picture-form">
            <input
              class="popup__input popup__input_type_name"
              name="name"
              placeholder="Enlace de la imagen"
              type="text"
              minlength="2"
              required
            />
            <span class="popup__error popup__error_type_name"></span>
            <button class="button popup__button" type="submit">Guardar</button>
          </form>
        </div>
      </div>

      <!--div del form de la nueva tarjeta-->
      <div class="popup" id="new-card-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Nuevo lugar</h3>
          <form class="popup__form" id="new-card-form">
            <input
              class="popup__input popup__input_type_card-name"
              name="name"
              placeholder="Título"
              required
              type="text"
              minlength="2"
              maxlength="30"
            />
            <span class="popup__error popup__error_type_name"></span>
            <input
              class="popup__input popup__input_type_url"
              name="link"
              placeholder="Enlace a la imagen"
              required
              type="url"
            />
            <span class="popup__error popup__error_type_link"></span>
            <button class="button popup__button" type="submit" disabled>Crear</button>
          </form>
        </div>
      </div>
      <div class="popup" id="image-popup">
        <div class="popup__content popup__content_content_image">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <img alt="" class="popup__image" src="#" />
          <p class="popup__caption"></p>
        </div>
      </div>
    </div>
  </body>
  <script src="./index.js" type="module"></script>
</html>
